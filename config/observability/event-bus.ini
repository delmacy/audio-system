[event_bus]
p0_capacity = 4096
p1_capacity = 8192
p2_capacity = 4096
p3_capacity = 2048
producer_enqueue_budget_us = 250
consumer_batch_size = 256
consumer_poll_ms = 25
p1_disk_spill_enabled = true
p1_disk_spill_max_mib = 256
p2_coalesce_enabled = true
p3_drop_on_pressure = true

[audit_jsonl]
enabled = true
flush_interval_ms = 250
flush_batch_events = 256

[prometheus]
enabled = true
textfile = runs/observability/recorder.prom
snapshot_interval_ms = 1000

[index_feed]
enabled = true
checkpoint_interval_events = 500

[cardinality]
allowed_labels = recorder_id,service_id,endpoint_id,session_slot,priority,sink
forbidden_dynamic_labels = file_id,track_instance_uuid,call_id,rtp_sequence
