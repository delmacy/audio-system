[system]
name = recorder-poc
config_version = 1
clock = UTC
scenario_timebase = milliseconds

[audio]
codec = PCMA
sample_rate_hz = 8000
channels = 1
payload_type = 8
packet_time_ms = 20

[protocols]
operational_signaling = SIP
session_description = SDP
recording_control = RTSP
media = RTP
media_control = RTCP

[recorder]
recording_container = MXF
index_backend = SQLite
sqlite_journal_mode = WAL
sqlite_synchronous = NORMAL
metrics_snapshot_ms = 1000
audit_batch_ms = 250
media_commit_interval_ms = 1000

[logging]
human_log_level = INFO
human_log_fanout_aggregate = true
keepalive_success_as_counter = true
rtp_packet_as_counter = true
critical_event_drop_allowed = false

[lab]
default_cwp_a_count = 5
default_cwp_b_count = 5
max_cwp_a_count = 100
max_cwp_b_count = 100
telephone_count = 5
radio_count = 2

[paths]
media_root = ./media
runs_root = ./runs
scenarios_root = ./scenarios

[topology]
change_policy = immediate
boundary_minutes = 60
force_immediate_for_required_new_media = true
logical_track_identity_version = 1

[file_manager]
precreate_file_count_gate = 100
precreate_lead_ms = 3000
ready_deadline_ms_before_window = 250
required_ready_ratio = 1.0
activation_dispatch_budget_ms = 250
boundary_failure_policy = BOUNDARY_SPILL_REQUIRED
no_create_on_boundary_path = true

[recorder_host]
phase3_single_session = true
phase4_radio_persistent_session = true
storage_boundary = appsink_win32_writer
rtsp_session_limit = 1
rtp_payload_type = 8
rtp_packet_time_ms = 20
active_file_share_read = true
active_file_share_write = false
active_file_share_delete = false
graceful_finalize_flush_file_buffers = true

[radio_session]
persistent_while_service_enabled = true
pause_closes_media_only = true
keepalive_success_as_counter = true
paused_rtp_recorded = false
session_header_required_after_setup = true
