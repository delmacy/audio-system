[profile]
name = external-recorder
mode = EXTERNAL_RECORDER

# Edit with Notepad before use. Do not hardcode these values in source code.
[network]
interface = Ethernet
bind_ip = CHANGE_ME

[recorder]
ip = CHANGE_ME
rtsp_port = 8554

[sip]
proxy_ip = CHANGE_ME
proxy_port = 5060
domain = training.local

[cwp-a]
count = 1
ip_start = CHANGE_ME
sip_name_prefix = cwpA

[cwp-b]
count = 0
ip_start = CHANGE_ME
sip_name_prefix = cwpB

[rtp]
port_start = 20000
port_end = 20999

[rtcp]
port_start = 21000
port_end = 21999

[safety]
require_validate_before_run = true
require_explicit_external_mode = true

[capture]
interface = auto
probe_port_start = 41000
probe_port_end = 41099
