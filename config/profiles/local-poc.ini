[profile]
name = local-poc
mode = INTERNAL_LAB

[network]
interface = POC-Loopback
bind_ip = 10.20.0.50
subnet = 10.20.0.0/16
prefix_length = 16

[recorder]
ip = 10.20.0.10
rtsp_port = 8554

[sip]
proxy_ip = 10.20.0.20
proxy_port = 5060
domain = poc.local

[cwp-a]
count = 5
max_count = 100
ip_start = 10.20.1.101
sip_name_prefix = cwpA

[cwp-b]
count = 5
max_count = 100
ip_start = 10.20.2.101
sip_name_prefix = cwpB

[telephone]
tel01 = sip:tel01@poc.local
tel02 = sip:tel02@poc.local
tel03 = sip:tel03@poc.local
tel04 = sip:tel04@poc.local
tel05 = sip:tel05@poc.local

[radio]
radio01 = RADIO-A
radio02 = RADIO-B

[rtp]
port_start = 20000
port_end = 29999

[rtcp]
port_start = 30000
port_end = 39999

[capture]
interface = auto
probe_port_start = 41000
probe_port_end = 41099
