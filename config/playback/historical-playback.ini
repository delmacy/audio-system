[playback]
schema = recorder-poc.historical-playback.v1
index_path = runs/index/temporal-index.sqlite
mode_default = continuous
utc_required = true
fabricate_silence = false
order_by = recording_window_start_utc,segment_sequence

[limits]
max_interval_minutes = 120
max_plan_items = 10000
include_events_default = true
