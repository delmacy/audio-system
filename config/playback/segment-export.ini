[playback_export]
default_mode = only_audio
sample_rate_hz = 8000
channels = 1
container = wav
source_codec = PCMA
output_codec = PCM_S16LE

[gap_policy]
only_audio = omit_from_audio_keep_in_manifest
continuous = synthesize_silence_marked_not_evidence

[resolver]
primary_track_selector = TrackInstanceUUID
fallback_track_selector = TrackIndex
require_logical_track_uuid = true
require_file_id = true

[harness]
# Avoid huge files in construction smoke while preserving plan semantics in manifest.
ms_per_plan_second = 10
max_item_render_ms = 2500
