[media_bank]
root=media-bank
raw_radio=media-bank/raw/radio-mixed
raw_telephone=media-bank/raw/telephone-mixed
radio_controller=media-bank/radio/controller
radio_pilot=media-bank/radio/pilot
radio_unknown=media-bank/radio/unknown
telephone_ring=media-bank/telephone/tones/ring
telephone_busy=media-bank/telephone/tones/busy
telephone_conversations=media-bank/telephone/conversations

[audio]
target_sample_rate_hz=8000
target_channels=1
staging_format=wav
codec_target=PCMA
packet_time_ms=20

[detect]
silence_db=-35
silence_ms=450
min_clip_ms=700
max_clip_ms=8000
padding_ms=120

[conversation]
default_service_type=radio
default_service_id=121500
default_endpoint_id=cwp-a01
media_flow=mono
min_pause_ms=250
max_pause_ms=1600
long_pause_probability=0.25
