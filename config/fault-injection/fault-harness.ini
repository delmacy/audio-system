[fault_injection]
schema = recorder-poc.fault-injection-harness.v1
default_seed = 20260919
fail_on_unobserved_fault = true
allow_silent_media_loss = false
allow_cross_track_contamination = false
allow_partial_promoted_as_complete = false

[targets]
rtp_loss = true
rtp_duplicate = true
rtp_out_of_order = true
rtsp_drop = true
indexer_restart = true
observability_degraded = true
export_retry = true
partial_file_recovery = true
