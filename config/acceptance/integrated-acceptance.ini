[acceptance]
phase = 22
name = Integrated Acceptance Plan
run_root = runs/acceptance
mode = deterministic_smoke
simulated_results_are_not_certification = true

[invariants]
cwp_direct_to_recorder = true
gateway_only_for_translated_ingress = true
mono_service_identity = true
rx_tx_base_tracks_allowed = false
live_buffer_is_evidence = false
synthetic_silence_is_recorded_evidence = false

[verdict]
required_not_run_forces = BLOCKED
required_blocked_forces = BLOCKED
any_fail_forces = FAIL
any_evidence_critical_failure_forces = FAIL
optional_not_run_allowed = true

[outputs]
json_report = integrated-acceptance-report.json
markdown_report = integrated-acceptance-report.md
summary_csv = integrated-acceptance-summary.csv
