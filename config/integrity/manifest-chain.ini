[integrity]
schema = recorder-poc.integrity-manifest-chain.v1
hash_algorithm = sha256
strict_file_id_match = true
strict_logical_track_uuid_match = true
strict_track_instance_uuid_match = true
strict_media_flow_mono = true
allow_synthetic_silence_as_evidence = false

[paths]
run_root = runs/integrity/manifest-chain-smoke
