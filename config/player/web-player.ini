[web_player]
mode = historical_shell
locale = pt-BR
default_timezone = America/Sao_Paulo
internal_time = UTC
fixture_path = web/player/fixtures/playback-plan.sample.json

[features]
service_tree = true
interval_selector = true
timeline_media_lane = true
timeline_gap_lane = true
timeline_event_lane = true
export_bundle_panel = true
live_mode = false

[policy]
media_flow = mono
base_rx_tx_split = false
synthetic_gap_silence_is_evidence = false
