[indexer]
database_path = runs/index/recorder-index.sqlite
journal_mode = WAL
synchronous = NORMAL
busy_timeout_ms = 5000
batch_size = 250
flush_interval_ms = 500

[source]
events_glob = runs/**/events.jsonl
manifest_glob = recordings/**/hour.manifest.json
checkpoint_enabled = true

[query]
time_basis = UTC
open_interval_policy = explicit
fabricate_silence = false
