[runbook]
version = 23.0.0
phase = 23
name = Operator Runbook / Deployment Notes

[paths]
root = .
run_output = runs/runbook
recordings = recordings
reports = runs

[policy]
unexecuted_gate_status = BLOCKED
allow_simulated_gate_to_pass_integrated_acceptance = false
live_buffer_is_evidence = false
synthetic_silence_is_evidence = false
fixture_audio_is_evidence = false

[invariants]
media_flow = mono
one_service_one_logical_track = true
rx_tx_are_not_default_mxf_tracks = true
cwp_direct_to_recorder = true
gateway_for_translated_ingress_only = true

[operator]
prefer_short_windows_path = true
require_admin_for_network_setup = true
avoid_cloud_synced_folder = true
