[scenario]
name = phase5-multi-cwp-routing-01
purpose = six concurrent RTSP/RTP sessions mapped to six isolated logical tracks/writers
session_count = 6
concurrent_start = true
route_collision_expected = 0
cross_session_contamination_expected = 0
all_teardown_graceful = true

[acceptance]
unique_session_id_per_route = true
unique_rtp_port_per_route = true
unique_track_instance_uuid = true
logical_track_uuid_matches_semantic_identity = true
all_files_closed_complete = true
all_expected_packet_counts_match = true
all_paused_probe_packets_ignored = true
single_host_process = true
