[scenario]
name = radio-persistent-01
deterministic = true
purpose = one enabled radio service remains in one RTSP session across repeated activity/silence cycles

[radio]
endpoint_id = CWP-A17
service_id = 121500
direction = RX
activity_signal = SQU
burst_count = 4
burst_ms = 300
silence_ms = 600
keepalive_interval_ms = 200
paused_probe_packets_per_silence = 1

[acceptance]
rtsp_sessions = 1
setup_count = 1
teardown_count = 1
record_count = 4
pause_count = 4
media_interval_count = 4
single_output_mxf = true
keepalive_success_is_aggregated = true
paused_rtp_must_not_be_recorded = true
