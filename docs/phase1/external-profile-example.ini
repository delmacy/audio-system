; EXAMPLE ONLY. Do not use these example addresses on a real network.
; Copy config/profiles/external-recorder-template.ini and fill it with values
; authorized for the training/lab environment.

[profile]
name = training-example
mode = EXTERNAL_RECORDER

[network]
interface = Ethernet
bind_ip = 192.0.2.10

[recorder]
ip = 192.0.2.20
rtsp_port = 8554

[sip]
proxy_ip = 192.0.2.30
proxy_port = 5060
domain = training.example

[cwp-a]
count = 1
ip_start = 192.0.2.10
sip_name_prefix = cwpA

[cwp-b]
count = 0
ip_start = 192.0.2.11
sip_name_prefix = cwpB

[rtp]
port_start = 20000
port_end = 20999

[rtcp]
port_start = 21000
port_end = 21999

[capture]
interface = auto
probe_port_start = 41000
probe_port_end = 41099

[safety]
require_validate_before_run = true
require_explicit_external_mode = true
