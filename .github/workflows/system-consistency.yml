name: System consistency

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consistency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Python, KLV and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile Python sources
        run: python -m compileall -q scripts/player scripts/gateway scripts/generator

      - name: Growing MXF KLV tests
        working-directory: scripts/player
        run: python -m unittest -v test_growing_mxf.py

      - name: Audio generator selftest
        run: python scripts/generator/audio_generator.py --selftest

      - name: Tone scenario planner tests
        working-directory: scripts/generator
        run: |
          python audio_scenario.py --selftest
          python -m unittest -v test_audio_scenario.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  package-smokes:
    name: Static package consistency
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tone PowerShell tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            './scripts/generator/New-TestTone.ps1',
            './scripts/generator/Invoke-ToneScenario.ps1',
            './scripts/cwp/Invoke-ServiceMonoSessionSimulator.ps1',
            './scripts/player/Invoke-MultiTrackToneTest.ps1',
            './scripts/recorder/Invoke-GrowingMxfCiSmoke.ps1',
            './scripts/recorder/Invoke-EventFileCiSmoke.ps1',
            './scripts/recorder/Invoke-EventRouteCapacityCiSmoke.ps1',
            './scripts/recorder/Invoke-EventFileBurstCiSmoke.ps1',
            './scripts/recorder/Start-EventRecorderLab.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parse failed for $file : $messages"
            }
          }

      - name: Closure handoff smoke
        shell: pwsh
        run: ./scripts/closure/Invoke-ClosureBacklogSmoke.ps1

      - name: Release packaging smoke
        shell: pwsh
        run: ./scripts/release/Invoke-FinalPocPackagingSmoke.ps1 -Json

  native-recorder:
    name: Native recorder and MXF build
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GSTREAMER_VERSION: '1.28.7'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for playback probe
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore installed GStreamer development bundle
        id: gstreamer-bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\gstreamer-installed\1.28.7\msvc_x86_64
          key: gstreamer-installed-${{ runner.os }}-msvc-x86_64-1.28.7-devel-v1

      - name: Cache GStreamer installer
        if: steps.gstreamer-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gstreamer-1.28.7.exe
          key: gstreamer-installer-${{ runner.os }}-msvc-x86_64-1.28.7

      - name: Install GStreamer development bundle
        if: steps.gstreamer-bundle-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "gstreamer-$env:GSTREAMER_VERSION.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          }

          $gstRoot = Join-Path $env:RUNNER_TEMP "gstreamer-installed\$env:GSTREAMER_VERSION\msvc_x86_64"
          New-Item -ItemType Directory -Force -Path $gstRoot | Out-Null
          $args = @(
            '/VERYSILENT',
            '/NORESTART',
            '/CURRENTUSER',
            '/TYPE=devel',
            "/DIR=$gstRoot"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GStreamer installer failed with exit code $($process.ExitCode)"
          }

      - name: Save installed GStreamer development bundle
        if: steps.gstreamer-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\gstreamer-installed\1.28.7\msvc_x86_64
          key: gstreamer-installed-${{ runner.os }}-msvc-x86_64-1.28.7-devel-v1

      - name: Configure GStreamer environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gstRoot = Join-Path $env:RUNNER_TEMP "gstreamer-installed\$env:GSTREAMER_VERSION\msvc_x86_64"
          if (-not (Test-Path -LiteralPath (Join-Path $gstRoot 'bin\gst-inspect-1.0.exe'))) {
            throw "Cached/installed GStreamer bundle is incomplete: $gstRoot"
          }
          "GSTREAMER_ROOT_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $gstRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if ('${{ steps.gstreamer-bundle-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "GStreamer bundle cache: HIT"
          }
          else {
            Write-Host "GStreamer bundle cache: MISS (installed and will be cached)"
          }

      - name: Verify GStreamer toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gst = Join-Path $env:GSTREAMER_ROOT_X86_64 'bin\gst-inspect-1.0.exe'
          $props = Join-Path $env:GSTREAMER_ROOT_X86_64 'share\vs\2010\libs\gstreamer-1.0.props'
          if (-not (Test-Path -LiteralPath $gst)) { throw "gst-inspect missing: $gst" }
          if (-not (Test-Path -LiteralPath $props)) { throw "GStreamer VS props missing: $props" }
          & $gst --version
          if ($LASTEXITCODE -ne 0) { throw 'gst-inspect version check failed' }

      - name: Build patched MXF identity plugin
        shell: pwsh
        run: ./scripts/mxf/Build-MxfIdentityPlugin.ps1

      - name: Verify generated MXF sources contain live and sparse-track patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mux = Get-Content -Raw -LiteralPath './src/mxf-identity-plugin/buildsrc/mxfmux.c'
          foreach ($term in @(
            'GstClockTime source_pts = pts;',
            'GST_BUFFER_OFFSET_END (outbuf) = pad->pos + 1;',
            'read-safe growing-MXF watermark'
          )) {
            if (-not $mux.Contains($term)) {
              throw "Generated mxfmux.c lost required patch marker: $term"
            }
          }

          $alaw = Get-Content -Raw -LiteralPath './src/mxf-identity-plugin/buildsrc/mxfalaw.c'
          foreach ($term in @(
            'valid G.711 A-law silence (0xD5)',
            'gst_buffer_memset (filler, 0, 0xD5',
            'MEDIA_START/MEDIA_END remains authoritative',
            'ret->quantization_bits = 8;'
          )) {
            if (-not $alaw.Contains($term)) {
              throw "Generated mxfalaw.c lost required sparse-track patch marker: $term"
            }
          }

      - name: Build recorder host and run selftest
        shell: pwsh
        run: ./scripts/recorder/Build-RecorderHost.ps1

      - name: Event recorder 1000-leg buffer admission stress
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(
            './src/recorder-host/x64/Release/recorder-host.exe',
            './src/recorder-host/Release/recorder-host.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $exe) { throw 'recorder-host.exe not found for event scale selftest.' }
          & $exe event-scale-selftest --legs 1000 --buffer-ms 4000 --max-admission-ms 2000
          if ($LASTEXITCODE -ne 0) {
            throw "Event scale selftest failed with exit code $LASTEXITCODE"
          }

      - name: Build native MXF inspector
        shell: pwsh
        run: ./scripts/mxf/Build-NativeMxfLab.ps1

      - name: Parse growing MXF E2E script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/recorder/Invoke-GrowingMxfCiSmoke.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Growing MXF read-while-recording E2E
        shell: pwsh
        run: ./scripts/recorder/Invoke-GrowingMxfCiSmoke.ps1

      - name: Event-file telephone E2E
        shell: pwsh
        run: ./scripts/recorder/Invoke-EventFileCiSmoke.ps1

      - name: Event-file 1000-route admission
        shell: pwsh
        run: ./scripts/recorder/Invoke-EventRouteCapacityCiSmoke.ps1 -SessionCount 1000

      - name: Event-file 1000 x 10s ring materialization
        shell: pwsh
        run: ./scripts/recorder/Invoke-EventFileBurstCiSmoke.ps1 -LegCount 1000 -RingSeconds 10 -ToneHz 440

      - name: Upload native E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: growing-mxf-e2e-diagnostics
          path: |
            runs/operational-recorder/**
            runs/event-recorder/**
            runs/event-capacity/**
            runs/event-burst/**
          if-no-files-found: ignore
          retention-days: 3
